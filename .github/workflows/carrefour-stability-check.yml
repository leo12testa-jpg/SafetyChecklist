name: Carrefour stability check
on:
  pull_request:
    branches: [main]
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core regression suite
        run: node --test tests/*.test.js
