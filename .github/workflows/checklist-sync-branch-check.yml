name: Checklist sync regression branch

on:
  push:
    branches:
      - fix/checklist-sync-20261005
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checklist-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core node regression suite
        shell: bash
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.test.js' ! -name 'ore-ui-contract.test.js' -print0 | xargs -0 node --test
      - name: Build consistency
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$(node -p "require('./version.json').buildId")"
          grep -q "const BUILD_ID = '${BUILD}'" js/aggiornamento.js
          grep -q "safety-checklist-shell-${BUILD}" service-worker.js
          grep -q "js/checklist.js?v=${BUILD}" index.html
          grep -q "js/app.js?v=${BUILD}" index.html
          grep -q "js/db.js?v=${BUILD}" index.html
          grep -q "js/pdf-import.js?v=${BUILD}" index.html
