name: Hardening branch check

on:
  push:
    branches: [hardening-sync-status-20260930]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check js/sync.js
          node --check js/app.js
          node --check js/db.js
      - name: Unit regression suite
        run: node --test tests/*.test.js
