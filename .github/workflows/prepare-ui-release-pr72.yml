name: Prepare PR72 offline release (temporary)
on:
  push:
    branches:
      - ui/sidebar-accessibility-polish-20261104

permissions:
  contents: write

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-ui-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare using the project's official release script
        run: ./pubblica.sh --prepare 1.0.0
      - name: Commit prepared cache and version files back to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js js/aggiornamento.js version.json
          if git diff --cached --quiet; then
            echo "Release script did not update any build files" >&2
            exit 1
          fi
          git commit -m "chore(release): prepare SafetyChecklist offline build"
          git push origin HEAD:refs/heads/ui/sidebar-accessibility-polish-20261104
