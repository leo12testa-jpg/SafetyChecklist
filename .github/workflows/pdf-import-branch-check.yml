name: PDF import regression branch

on:
  push:
    branches:
      - fix/pdf-import-interparking-perfect-20261005
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pdf-import-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PDF import regression suite
        run: |
          node --test             tests/pdf-import-extraction.test.js             tests/pdf-source-rows.test.js             tests/pdf-header-images.test.js             tests/import-matching.test.js
