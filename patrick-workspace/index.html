<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12243a"><meta name="description" content="Patrick Workspace: agenda, note telefoniche, contatti e attività.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=5">
<title>Patrick Workspace · Agenda e note</title>
</head>
<body>
<div id="appShell" class="app-shell">
<aside class="sidebar"><div class="sidebar-head"><div class="brand-mark">P.</div><div><strong>Patrick</strong><small>WORKSPACE</small></div></div><div class="side-label">IL TUO SPAZIO</div><nav class="main-nav" aria-label="Navigazione principale"><button data-view="home" class="nav-button selected"><span>◫</span> Panoramica</button><button data-view="agenda" class="nav-button"><span>▦</span> Agenda</button><button data-view="notes" class="nav-button"><span>▤</span> Note</button><button data-view="tasks" class="nav-button"><span>✓</span> Attività</button><button data-view="contacts" class="nav-button"><span>♧</span> Contatti</button></nav><div class="sidebar-footer"><div class="avatar">P</div><div class="identity"><strong>Archivio locale</strong><small>Salvato sul dispositivo</small></div></div></aside>
<div class="workspace"><header class="topbar"><div><div class="eyebrow" id="todayLine"></div><h1 id="pageTitle">Panoramica</h1></div><div class="top-actions"><label class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="Cerca in tutto..." aria-label="Cerca in note, attività e contatti"></label><button id="exportButton" class="icon-btn" title="Scarica backup JSON" aria-label="Scarica backup">⇩</button><button id="importButton" class="icon-btn" title="Importa backup JSON" aria-label="Importa backup">⇧</button><input id="importFile" class="visually-hidden" type="file" accept=".json,application/json" aria-label="Scegli file backup"><button id="addButton" class="btn primary">+ Nuovo</button></div></header>
<div id="errorBanner" class="error-banner" hidden></div>
<div class="local-notice"><span>◌</span> <strong>Solo su questo dispositivo:</strong> i dati rimangono nel browser di questo PC. Scarica regolarmente un backup con ⇩.</div><main id="view" class="content"></main><footer class="app-foot"><span id="syncLabel">Archivio locale · Nessun account necessario</span><span>Patrick Workspace</span></footer>
</div>
<nav class="mobile-nav" aria-label="Navigazione mobile"><button data-view="home">◫<small>Home</small></button><button data-view="agenda">▦<small>Agenda</small></button><button data-view="notes">▤<small>Note</small></button><button data-view="tasks">✓<small>Attività</small></button><button data-view="contacts">♧<small>Contatti</small></button></nav>
</div>
<dialog id="recordDialog"><form id="recordForm" class="record-form"><div class="dialog-head"><div><span class="eyebrow">PATRICK WORKSPACE</span><h2 id="formTitle">Nuovo elemento</h2></div><button type="button" id="closeDialog" class="close-btn" aria-label="Chiudi">×</button></div><div class="field-grid"><label class="full">Categoria<select name="category" id="fieldCategory" required><option value="note">Nota</option><option value="event">Appuntamento</option><option value="task">Attività</option><option value="contact">Contatto</option></select></label><label class="full">Titolo / Nome<input name="title" maxlength="240" placeholder="Cosa vuoi ricordare?" required></label><label class="full field-detail">Dettagli<textarea name="details" rows="4" maxlength="20000" placeholder="Appunti e informazioni utili"></textarea></label><label class="field-event">Inizio appuntamento<input type="datetime-local" name="starts_at"></label><label class="field-task">Scadenza<input type="datetime-local" name="due_at"></label><label class="field-task">Priorità<select name="priority"><option value="media">Media</option><option value="alta">Alta</option><option value="bassa">Bassa</option></select></label><label class="field-task">Stato<select name="status"><option value="aperta">Da fare</option><option value="completata">Completata</option></select></label><label class="field-contact">Azienda<input name="company" maxlength="160" placeholder="Azienda"></label><label class="field-contact">Telefono<input name="phone" type="tel" maxlength="64" placeholder="+39 ..."></label><label class="full field-contact">Email<input name="email" type="email" maxlength="255" placeholder="contatto@azienda.it"></label><label class="full field-related">Collega a un contatto<select name="contact_id" id="fieldContact"><option value="">Nessuno</option></select></label><label class="full field-related">Etichette<input name="tags" maxlength="180" placeholder="Es. preventivo, chiamata, riunione"></label></div><div class="dialog-actions"><button type="button" class="btn danger" id="deleteRecordButton" hidden>Elimina</button><button type="button" class="btn secondary" id="cancelForm">Annulla</button><button type="submit" class="btn primary" id="saveRecord">Salva</button></div><p id="formMessage" class="feedback" aria-live="polite"></p></form></dialog>
<script src="./app.js?v=5" defer></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./service-worker.js",{scope:"./",updateViaCache:"none"}).catch(()=>{});});}</script>
</body></html>
